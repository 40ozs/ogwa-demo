services:
  ogwa:
    build: .
    image: ogwa-demo:local
    init: true
    ports:
      # Loopback only. The API accepts browser requests from http://localhost:8765 and
      # http://127.0.0.1:8765, so keep the host port 8765.
      - "127.0.0.1:8765:8765"
    volumes:
      - demo-store:/app/var

volumes:
  # The demo store. `docker compose down -v` deletes it; the next start seeds it again.
  demo-store:
